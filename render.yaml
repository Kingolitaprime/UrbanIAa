services:
  - type: web
    name: urbania-cordoba
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 240
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PLANIFICADOR_PASSWORD
        sync: false
      - key: CONSULTOR_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
